        }

        padding: 0;
        }

        margin: 12px 0;
        }
        aside a {
        color: #475569;
        text-decoration: none;
        display: inline-block;
        padding: 6px;
        }
        aside a:hover {
        background-color: #f1f5f9;
        color: #0ea5e9;
        padding-left: 12px;
        }
        section {
        width: 75%;
        padding: 20px;
        box-sizing: border-box;

        width: 100%;

        }
        footer {

        color: #ffffff;
        text-align: center;
